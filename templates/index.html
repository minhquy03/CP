<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Cloud Assistant - Dao Minh Quy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            height: 600px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 25px;
            color: #222;
        }

        .header p {
            margin: 4px 0;
            color: #555;
            font-size: 14px;
        }

        .student-info {
            background: #f1f5ff;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .student-info strong {
            color: #333;
        }

        /* AI description */
        .description {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        /* Chat area */
        .chat-box {
            flex: 1;
            overflow-y: auto;

            border: 1px solid #ddd;
            border-radius: 8px;

            padding: 12px;
            margin-bottom: 12px;

            display: flex;
            flex-direction: column;
            gap: 8px;

            background: #fafafa;
        }

        .message {
            padding: 9px 13px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .bot {
            background: #e9ecef;
            color: #333;
            align-self: flex-start;
        }

        /* Input area */
        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 11px;

            border: 1px solid #ddd;
            border-radius: 6px;

            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            padding: 10px 18px;

            background: #007bff;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 12px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Project title -->
        <div class="header">
            <h1>AI Cloud Assistant</h1>
            <p>Simple AI-based Cloud Service</p>
        </div>

        <!-- Student information -->
        <div class="student-info">
            <strong>Name:</strong> Đào Minh Quý
            <br>
            <strong>Student ID:</strong> 2026512818
        </div>

        <!-- Description -->
        <div class="description">
            Ask a question and get an AI-generated response.
        </div>

        <!-- Chat messages -->
        <div class="chat-box" id="chatBox">

            <div class="message bot">
                Hello! I'm your AI Cloud Assistant.
                How can I help you today?
            </div>

        </div>

        <!-- User input -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button id="sendButton" onclick="sendMessage()">
                Send
            </button>

        </div>

        <!-- Footer -->
        <div class="footer">
            AI Cloud Service | Render Deployment Project
        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendButton = document.getElementById("sendButton");


        // Press Enter to send message
        userInput.addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // Send message to Flask backend
        async function sendMessage() {

            const text = userInput.value.trim();

            if (!text) {
                return;
            }


            // Display user's message
            appendMessage(text, "user");

            userInput.value = "";

            // Disable button while waiting
            sendButton.disabled = true;
            sendButton.textContent = "Thinking...";


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })

                });


                const data = await response.json();


                if (data.reply) {

                    appendMessage(data.reply, "bot");

                } else {

                    appendMessage(
                        "Sorry, I could not generate a response.",
                        "bot"
                    );

                }


            } catch (error) {

                console.error(error);

                appendMessage(
                    "Error connecting to the AI server.",
                    "bot"
                );

            }


            // Enable button again
            sendButton.disabled = false;
            sendButton.textContent = "Send";
        }


        // Add message to chat box
        function appendMessage(text, sender) {

            const div = document.createElement("div");

            div.className = "message " + sender;

            div.textContent = text;

            chatBox.appendChild(div);

            chatBox.scrollTop = chatBox.scrollHeight;
        }

    </script>

</body>
</html>
